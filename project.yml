name: QueueFox
options:
  bundleIdPrefix: com.tomerady
  deploymentTarget:
    iOS: "18.0"
    watchOS: "11.0"
  createIntermediateGroups: true
settings:
  base:
    DEVELOPMENT_TEAM: 56N4LCCUN2
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
    # Who the app is. Every build is QueueFox Dev -- a separate app that installs beside the real
    # one, with its own pairing, the dev worker and the dev prerelease -- until ios/make-real.sh
    # switches these to the real app, which only Xcode Cloud (TestFlight) and main's release do.
    # The dev icon is the real one in purple rather than orange, so the two tell apart at a
    # glance on the home screen.
    QF_BUNDLE_ID: com.tomerady.QueueFox.dev
    QF_APP_NAME: QueueFox Dev
    QF_APP_ICON: AppIcon-Dev
    QF_PAIR_SCHEME: queuefox-dev
    QF_WORKER_URL: https://queuefox-push-relay-dev.tomerady.workers.dev
    QF_RELEASE_API: https://api.github.com/repos/overjump1/queuefox/releases/tags/dev-latest
    # CI stamps every build that goes anywhere; 0.0.0 is one nobody stamped (ios/iOS/Updates.swift).
    MARKETING_VERSION: "0.0.0"
    CURRENT_PROJECT_VERSION: "1"
packages:
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk
    from: 11.0.0
targets:
  QueueFox:
    type: application
    platform: iOS
    sources:
      - ios/iOS
      - ios/Shared
    dependencies:
      - target: QueueWidgets
      - target: QueueFox Watch App
      - package: Firebase
        product: FirebaseMessaging
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(QF_BUNDLE_ID)
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: $(QF_APP_ICON)
    info:
      path: ios/iOS/Info.plist
      properties:
        CFBundleDisplayName: $(QF_APP_NAME)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIUserInterfaceStyle: Dark
        NSSupportsLiveActivities: true
        NSSupportsLiveActivitiesFrequentUpdates: true
        NSCameraUsageDescription: Scans the pairing code shown on your PC.
        UIBackgroundModes: [remote-notification]
        FirebaseAppDelegateProxyEnabled: false
        ITSAppUsesNonExemptEncryption: false
        CFBundleURLTypes:
          - CFBundleURLName: $(QF_BUNDLE_ID).pair
            CFBundleURLSchemes: [$(QF_PAIR_SCHEME)]
        QFWorkerURL: $(QF_WORKER_URL)
        QFReleaseAPI: $(QF_RELEASE_API)
    entitlements:
      path: ios/iOS/QueueFox.entitlements
      properties:
        aps-environment: development
        com.apple.developer.usernotifications.time-sensitive: true

  QueueWidgets:
    type: app-extension
    platform: iOS
    sources:
      - ios/Widgets
      - path: ios/Shared
        excludes: ["*.caf"]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(QF_BUNDLE_ID).QueueWidgets
        TARGETED_DEVICE_FAMILY: "1"
    info:
      path: ios/Widgets/Info.plist
      properties:
        CFBundleDisplayName: $(QF_APP_NAME)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension

  QueueFox Watch App:
    type: application
    platform: watchOS
    sources:
      - ios/Watch
      - ios/Shared
    dependencies:
      - package: Firebase
        product: FirebaseMessaging
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(QF_BUNDLE_ID).watchkitapp
        TARGETED_DEVICE_FAMILY: "4"
        SKIP_INSTALL: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: $(QF_APP_ICON)
    info:
      path: ios/Watch/Info.plist
      properties:
        CFBundleDisplayName: $(QF_APP_NAME)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        WKApplication: true
        WKCompanionAppBundleIdentifier: $(QF_BUNDLE_ID)
        WKRunsIndependentlyOfCompanionApp: true
        WKSupportsLiveActivityLaunchAttributeTypes: [QueueActivityAttributes]
        QFWorkerURL: $(QF_WORKER_URL)
        UIBackgroundModes: [remote-notification]
        FirebaseAppDelegateProxyEnabled: false
        ITSAppUsesNonExemptEncryption: false
    entitlements:
      path: ios/Watch/Watch.entitlements
      properties:
        aps-environment: development
        com.apple.developer.usernotifications.time-sensitive: true

schemes:
  QueueFox:
    build:
      targets:
        QueueFox: all
    run:
      config: Debug
    archive:
      config: Release
