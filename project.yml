name: OverQueue
options:
  bundleIdPrefix: com.tomerady
  deploymentTarget:
    iOS: "18.0"
    watchOS: "11.0"
  createIntermediateGroups: true
settings:
  base:
    DEVELOPMENT_TEAM: 56N4LCCUN2
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
    # Who the app is. CI's dev builds override both on the xcodebuild command line to make
    # OverQueue Dev, a separate app that installs beside this one (.github/workflows/ios-app.yml).
    OWQ_BUNDLE_ID: com.tomerady.OverwatchQueue
    OWQ_APP_NAME: OverQueue
    # CI stamps every build that goes anywhere; 0.0.0 is one nobody stamped (ios/iOS/Updates.swift).
    MARKETING_VERSION: "0.0.0"
    CURRENT_PROJECT_VERSION: "1"
packages:
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk
    from: 11.0.0
targets:
  OverQueue:
    type: application
    platform: iOS
    sources:
      - ios/iOS
      - ios/Shared
    dependencies:
      - target: QueueWidgets
      - target: OverQueue Watch App
      - package: Firebase
        product: FirebaseMessaging
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(OWQ_BUNDLE_ID)
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: ios/iOS/Info.plist
      properties:
        CFBundleDisplayName: $(OWQ_APP_NAME)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIUserInterfaceStyle: Dark
        NSSupportsLiveActivities: true
        NSSupportsLiveActivitiesFrequentUpdates: true
        NSCameraUsageDescription: Scans the pairing code shown on your PC.
        UIBackgroundModes: [remote-notification]
        FirebaseAppDelegateProxyEnabled: false
        ITSAppUsesNonExemptEncryption: false
        CFBundleURLTypes:
          - CFBundleURLName: $(OWQ_BUNDLE_ID).pair
            CFBundleURLSchemes: [overqueue, owq]
    entitlements:
      path: ios/iOS/OverQueue.entitlements
      properties:
        aps-environment: development
        com.apple.developer.usernotifications.time-sensitive: true

  QueueWidgets:
    type: app-extension
    platform: iOS
    sources:
      - ios/Widgets
      - path: ios/Shared
        excludes: ["*.caf"]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(OWQ_BUNDLE_ID).QueueWidgets
        TARGETED_DEVICE_FAMILY: "1"
    info:
      path: ios/Widgets/Info.plist
      properties:
        CFBundleDisplayName: $(OWQ_APP_NAME)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension

  OverQueue Watch App:
    type: application
    platform: watchOS
    sources:
      - ios/Watch
      - ios/Shared
    dependencies:
      - package: Firebase
        product: FirebaseMessaging
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(OWQ_BUNDLE_ID).watchkitapp
        TARGETED_DEVICE_FAMILY: "4"
        SKIP_INSTALL: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: ios/Watch/Info.plist
      properties:
        CFBundleDisplayName: $(OWQ_APP_NAME)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        WKApplication: true
        WKCompanionAppBundleIdentifier: $(OWQ_BUNDLE_ID)
        WKRunsIndependentlyOfCompanionApp: true
        WKSupportsLiveActivityLaunchAttributeTypes: [QueueActivityAttributes]
        UIBackgroundModes: [remote-notification]
        FirebaseAppDelegateProxyEnabled: false
        ITSAppUsesNonExemptEncryption: false
    entitlements:
      path: ios/Watch/Watch.entitlements
      properties:
        aps-environment: development
        com.apple.developer.usernotifications.time-sensitive: true

schemes:
  OverQueue:
    build:
      targets:
        OverQueue: all
    run:
      config: Debug
    archive:
      config: Release
