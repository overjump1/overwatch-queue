name: iOS app

# Pull requests build an unsigned IPA as a workflow artifact. Releases come from release.yml.
# TestFlight builds still come from Xcode Cloud; this IPA is for sideloading (AltStore, Sideloadly),
# which signs it with your own Apple ID.
on:
  pull_request:
    paths:
      - "ios/**"
      - "project.yml"
      - "OverQueue.xcodeproj/**"
      - ".github/workflows/ios-app.yml"
  # The Release workflow calls this when the app changed since the last release.
  workflow_call:
    inputs:
      version:
        type: string
        required: true
      build-number:
        type: number
        required: false
        default: 1
      # Builds OverQueue Dev: a separate app, com.tomerady.OverwatchQueue.dev, that installs beside
      # the real one, talking to the worker and updating from the release below.
      dev:
        type: boolean
        required: false
        default: false
      # A dev build's worker and the release it updates from (see release.yml). Left empty, the
      # build keeps the real ones it ships with.
      worker-url:
        type: string
        required: false
        default: ""
      release-api:
        type: string
        required: false
        default: ""
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    env:
      # Who the app is; the watch app and the widgets hang off it (project.yml).
      BUNDLE_ID: com.tomerady.OverwatchQueue${{ inputs.dev && '.dev' || '' }}
      APP_NAME: ${{ inputs.dev && 'OverQueue Dev' || 'OverQueue' }}
    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      # Each Firebase iOS app is one bundle ID, so OverQueue Dev has configs of its own.
      - name: Firebase config
        env:
          GOOGLE_SERVICE_INFO_PLIST: ${{ inputs.dev && secrets.DEV_GOOGLE_SERVICE_INFO_PLIST || secrets.GOOGLE_SERVICE_INFO_PLIST }}
          WATCH_GOOGLE_SERVICE_INFO_PLIST: ${{ inputs.dev && secrets.DEV_WATCH_GOOGLE_SERVICE_INFO_PLIST || secrets.WATCH_GOOGLE_SERVICE_INFO_PLIST }}
          SECRET_PREFIX: ${{ inputs.dev && 'DEV_' || '' }}
        run: |
          write_config() {
            if [ -n "$1" ]; then
              printf '%s' "$1" | base64 --decode > "$2"
            else
              # Lets the build compile. That app can't get pushes.
              echo "::warning::$3 secret isn't set; $2 is a placeholder and the app won't get pushes."
              cat > "$2" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>API_KEY</key><string>placeholder</string>
            <key>GCM_SENDER_ID</key><string>000000000000</string>
            <key>BUNDLE_ID</key><string>$4</string>
            <key>PROJECT_ID</key><string>overqueue-placeholder</string>
            <key>GOOGLE_APP_ID</key><string>1:000000000000:ios:0000000000000000</string>
          </dict></plist>
          EOF
            fi
          }
          write_config "$GOOGLE_SERVICE_INFO_PLIST" ios/iOS/GoogleService-Info.plist \
            "${SECRET_PREFIX}GOOGLE_SERVICE_INFO_PLIST" "$BUNDLE_ID"
          write_config "$WATCH_GOOGLE_SERVICE_INFO_PLIST" ios/Watch/GoogleService-Info.plist \
            "${SECRET_PREFIX}WATCH_GOOGLE_SERVICE_INFO_PLIST" "$BUNDLE_ID.watchkitapp"

      - name: Version
        id: version
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            echo "version=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "version=0.0.0-dev.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          fi

      # Only this build's updates live on GitHub, so only this build looks there
      # (ios/iOS/Updates.swift). TestFlight and the App Store hand out their own.
      - name: Mark as a GitHub release build
        run: |
          plist=ios/iOS/Info.plist
          /usr/libexec/PlistBuddy -c "Delete :OWQGitHubBuild" "$plist" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :OWQGitHubBuild bool true" "$plist"

      # A dev build talks to the dev worker and updates from the dev prerelease. The watch app talks
      # to the worker as well, so it gets the address too; only the phone app checks for updates.
      - name: Point a dev build at the dev worker
        env:
          WORKER_URL: ${{ inputs.worker-url }}
          RELEASE_API: ${{ inputs.release-api }}
        run: |
          stamp() {
            [ -n "$3" ] || return 0
            /usr/libexec/PlistBuddy -c "Delete :$2" "$1" 2>/dev/null || true
            /usr/libexec/PlistBuddy -c "Add :$2 string $3" "$1"
            [ "$(/usr/libexec/PlistBuddy -c "Print :$2" "$1")" = "$3" ] \
              || { echo "::error::$2 didn't land in $1"; exit 1; }
          }
          stamp ios/iOS/Info.plist OWQWorkerURL "$WORKER_URL"
          stamp ios/Watch/Info.plist OWQWorkerURL "$WORKER_URL"
          stamp ios/iOS/Info.plist OWQReleaseAPI "$RELEASE_API"

      # OverQueue Dev answers only to the dev PC app's QR code, and the real app only to the real
      # one's, so a phone can't be paired to the wrong PC app (ios/Shared/Worker.swift).
      - name: Give a dev build its own pairing link
        if: inputs.dev
        run: |
          plist=ios/iOS/Info.plist
          /usr/libexec/PlistBuddy -c "Delete :CFBundleURLTypes:0:CFBundleURLSchemes" "$plist"
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0:CFBundleURLSchemes array" "$plist"
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0:CFBundleURLSchemes:0 string overqueue-dev" "$plist"
          schemes=$(/usr/libexec/PlistBuddy -c "Print :CFBundleURLTypes:0:CFBundleURLSchemes" "$plist" | xargs)
          [ "$schemes" = "Array { overqueue-dev }" ] || { echo "::error::the pairing link didn't land in $plist"; exit 1; }

      - name: Build
        run: >
          xcodebuild build
          -project OverQueue.xcodeproj
          -scheme OverQueue
          -configuration Release
          -destination generic/platform=iOS
          -derivedDataPath build
          -skipPackagePluginValidation
          -skipMacroValidation
          MARKETING_VERSION=${{ steps.version.outputs.version }}
          CURRENT_PROJECT_VERSION=${{ inputs.build-number || github.run_number }}
          OWQ_BUNDLE_ID="$BUNDLE_ID"
          OWQ_APP_NAME="$APP_NAME"
          CODE_SIGNING_ALLOWED=NO
          CODE_SIGNING_REQUIRED=NO
          CODE_SIGN_IDENTITY=""

      - name: Package IPA
        run: |
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/OverQueue.app Payload/
          zip -qry "OverQueue-${{ steps.version.outputs.version }}.ipa" Payload

      - uses: actions/upload-artifact@v4
        with:
          name: OverQueue-${{ steps.version.outputs.version }}-ios
          path: OverQueue-*.ipa
          if-no-files-found: error
