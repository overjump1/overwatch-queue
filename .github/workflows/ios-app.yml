name: iOS app

# Pull requests build an unsigned IPA as a workflow artifact. Releases come from release.yml.
# TestFlight builds still come from Xcode Cloud; this IPA is for sideloading (AltStore, Sideloadly),
# which signs it with your own Apple ID.
on:
  pull_request:
    paths:
      - "ios/**"
      - "project.yml"
      - "OverQueue.xcodeproj/**"
      - ".github/workflows/ios-app.yml"
  # The Release workflow calls this when the app changed since the last release.
  workflow_call:
    inputs:
      version:
        type: string
        required: true
      build-number:
        type: number
        required: false
        default: 1
      # Builds the real OverQueue, for main's release. Everything else -- pull requests, the dev
      # branch, a manual run -- is OverQueue Dev (project.yml). TestFlight is real too, but that's
      # Xcode Cloud's (ci_scripts/ci_post_clone.sh).
      real:
        type: boolean
        required: false
        default: false
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    env:
      # Who the app is; the watch app and the widgets hang off it (project.yml).
      BUNDLE_ID: com.tomerady.OverwatchQueue${{ !inputs.real && '.dev' || '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      # Each Firebase iOS app is one bundle ID, so OverQueue Dev has configs of its own.
      - name: Firebase config
        env:
          GOOGLE_SERVICE_INFO_PLIST: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST }}
          WATCH_GOOGLE_SERVICE_INFO_PLIST: ${{ secrets.WATCH_GOOGLE_SERVICE_INFO_PLIST }}
          DEV_GOOGLE_SERVICE_INFO_PLIST: ${{ secrets.DEV_GOOGLE_SERVICE_INFO_PLIST }}
          DEV_WATCH_GOOGLE_SERVICE_INFO_PLIST: ${{ secrets.DEV_WATCH_GOOGLE_SERVICE_INFO_PLIST }}
          # Picked here rather than with `real && a || b`, which falls through to b whenever a is
          # empty -- a real build missing its secret would quietly get the dev app's config.
          SECRET_PREFIX: ${{ !inputs.real && 'DEV_' || '' }}
        run: |
          write_config() {
            if [ -n "$1" ]; then
              printf '%s' "$1" | base64 --decode > "$2"
            else
              # Lets the build compile. That app can't get pushes.
              echo "::warning::$3 secret isn't set; $2 is a placeholder and the app won't get pushes."
              cat > "$2" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>API_KEY</key><string>placeholder</string>
            <key>GCM_SENDER_ID</key><string>000000000000</string>
            <key>BUNDLE_ID</key><string>$4</string>
            <key>PROJECT_ID</key><string>overqueue-placeholder</string>
            <key>GOOGLE_APP_ID</key><string>1:000000000000:ios:0000000000000000</string>
          </dict></plist>
          EOF
            fi
          }
          phone="${SECRET_PREFIX}GOOGLE_SERVICE_INFO_PLIST"
          watch="${SECRET_PREFIX}WATCH_GOOGLE_SERVICE_INFO_PLIST"
          write_config "$(printenv "$phone" || true)" ios/iOS/GoogleService-Info.plist "$phone" "$BUNDLE_ID"
          write_config "$(printenv "$watch" || true)" ios/Watch/GoogleService-Info.plist "$watch" "$BUNDLE_ID.watchkitapp"

      - name: Version
        id: version
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            echo "version=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "version=0.0.0-dev.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          fi

      # Only this build's updates live on GitHub, so only this build looks there
      # (ios/iOS/Updates.swift). TestFlight and the App Store hand out their own.
      - name: Mark as a GitHub release build
        run: |
          plist=ios/iOS/Info.plist
          /usr/libexec/PlistBuddy -c "Delete :OWQGitHubBuild" "$plist" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :OWQGitHubBuild bool true" "$plist"

      # The project is OverQueue Dev on its own; main's release is the real app.
      - name: Make it the real OverQueue
        if: inputs.real
        run: sh ios/make-real.sh

      - name: Build
        run: >
          xcodebuild build
          -project OverQueue.xcodeproj
          -scheme OverQueue
          -configuration Release
          -destination generic/platform=iOS
          -derivedDataPath build
          -skipPackagePluginValidation
          -skipMacroValidation
          MARKETING_VERSION=${{ steps.version.outputs.version }}
          CURRENT_PROJECT_VERSION=${{ inputs.build-number || github.run_number }}
          CODE_SIGNING_ALLOWED=NO
          CODE_SIGNING_REQUIRED=NO
          CODE_SIGN_IDENTITY=""

      - name: Package IPA
        run: |
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/OverQueue.app Payload/
          zip -qry "OverQueue-${{ steps.version.outputs.version }}.ipa" Payload

      - uses: actions/upload-artifact@v4
        with:
          name: OverQueue-${{ steps.version.outputs.version }}-ios
          path: OverQueue-*.ipa
          if-no-files-found: error
