name: Windows app

# Pull requests build the installer as a workflow artifact. Releases come from release.yml.
on:
  pull_request:
    paths:
      - "pc/**"
      - ".github/workflows/windows-app.yml"
  # The Release workflow calls this when the app changed since the last release.
  workflow_call:
    inputs:
      version:
        type: string
        required: true
      # Builds OverQueue Dev, the separate app that talks to the dev worker (see pc/channel.py).
      dev:
        type: boolean
        required: false
        default: false
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pc/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r pc/requirements.txt pyinstaller

      - name: Test
        run: python -m unittest discover -s pc/tests

      - name: Version
        id: version
        shell: bash
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            echo "version=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "version=0.0.0-dev.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          fi

      # The app compares this against the latest release to decide whether to offer an update.
      # Pull request builds stay on a 0.x version, which turns the check off.
      - name: Stamp the version
        shell: bash
        run: sed -i 's/^VERSION = .*/VERSION = "${{ steps.version.outputs.version }}"/' pc/version.py

      # OverQueue Dev: its own pairing, the dev worker and the dev prerelease (pc/channel.py), and an
      # installer that goes beside the real app. Checked afterwards, because a sed that matches
      # nothing succeeds anyway and would ship the dev build as the real app without a word.
      - name: Make it OverQueue Dev
        if: inputs.dev
        shell: bash
        run: |
          sed -i 's/^DEV = .*/DEV = True/' pc/version.py
          grep -qx 'DEV = True' pc/version.py || { echo "::error::DEV didn't land in pc/version.py"; exit 1; }

      - name: Build app
        run: pyinstaller --noconfirm pc/overqueue.spec

      - name: Build installer
        run: |
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue)) {
            $inno = "${env:ProgramFiles(x86)}\Inno Setup 6"
            if (-not (Test-Path "$inno\ISCC.exe")) { choco install innosetup -y --no-progress }
            $env:Path += ";$inno"
          }
          $defines = @("/DAppVersion=${{ steps.version.outputs.version }}")
          if ("${{ inputs.dev }}" -eq "true") { $defines += "/DDev" }
          iscc @defines pc\installer.iss
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      - uses: actions/upload-artifact@v4
        with:
          name: OverQueue-Setup-${{ steps.version.outputs.version }}
          path: dist/OverQueue-Setup-*.exe
          if-no-files-found: error
