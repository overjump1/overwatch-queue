name: Windows app

# Pull requests build the installer as a workflow artifact. Releases come from release.yml.
on:
  pull_request:
    paths:
      - "pc/**"
      - ".github/workflows/windows-app.yml"
  # The Release workflow calls this when the app changed since the last release.
  workflow_call:
    inputs:
      version:
        type: string
        required: true
      # A dev build's worker and the release it updates from (see release.yml). Left empty, the
      # build keeps the real ones it ships with.
      worker-url:
        type: string
        required: false
        default: ""
      release-api:
        type: string
        required: false
        default: ""
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pc/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r pc/requirements.txt pyinstaller

      - name: Test
        run: python -m unittest discover -s pc/tests

      - name: Version
        id: version
        shell: bash
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            echo "version=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "version=0.0.0-dev.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          fi

      # The app compares this against the latest release to decide whether to offer an update.
      # Pull request builds stay on a 0.x version, which turns the check off.
      - name: Stamp the version
        shell: bash
        run: sed -i 's/^VERSION = .*/VERSION = "${{ steps.version.outputs.version }}"/' pc/version.py

      # A dev build talks to the dev worker and updates from the dev prerelease. Checked afterwards,
      # because a sed that matches nothing succeeds anyway and would ship a dev build on the real
      # worker without a word.
      - name: Point a dev build at the dev worker
        shell: bash
        env:
          WORKER_URL: ${{ inputs.worker-url }}
          RELEASE_API: ${{ inputs.release-api }}
        run: |
          stamp() {
            [ -n "$2" ] || return 0
            sed -i "s|^$1 = .*|$1 = \"$2\"|" pc/version.py
            grep -qxF "$1 = \"$2\"" pc/version.py || { echo "::error::$1 didn't land in pc/version.py"; exit 1; }
          }
          stamp WORKER_URL "$WORKER_URL"
          stamp RELEASE_API "$RELEASE_API"

      - name: Build app
        run: pyinstaller --noconfirm pc/overqueue.spec

      - name: Build installer
        run: |
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue)) {
            $inno = "${env:ProgramFiles(x86)}\Inno Setup 6"
            if (-not (Test-Path "$inno\ISCC.exe")) { choco install innosetup -y --no-progress }
            $env:Path += ";$inno"
          }
          iscc /DAppVersion=${{ steps.version.outputs.version }} pc\installer.iss
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      - uses: actions/upload-artifact@v4
        with:
          name: OverQueue-Setup-${{ steps.version.outputs.version }}
          path: dist/OverQueue-Setup-*.exe
          if-no-files-found: error
