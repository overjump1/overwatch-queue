name: Windows app

# Pull requests build the installer as a workflow artifact. Releases come from release.yml.
on:
  pull_request:
    paths:
      - "pc/**"
      - ".github/workflows/windows-app.yml"
  # The Release workflow calls this when the app changed since the last release.
  workflow_call:
    inputs:
      version:
        type: string
        required: true
      # Builds the real OverQueue, for main's release. Everything else -- pull requests, the dev
      # branch, a manual run -- is OverQueue Dev (see pc/channel.py).
      real:
        type: boolean
        required: false
        default: false
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pc/requirements.txt

      # PyInstaller is built from source so it compiles its own bootloader (the stub OverQueue.exe
      # starts from) instead of using the prebuilt one in the wheel. Malware ships that exact prebuilt
      # stub too, so Defender's machine-learning scan learned to flag it: our releases were getting
      # quarantined as Trojan:Win32/Bearfoos!ml. Pinned, so a new PyInstaller can't change the stub
      # under a release unannounced.
      - name: Install dependencies
        env:
          PYINSTALLER_COMPILE_BOOTLOADER: "1"
        run: |
          python -m pip install --upgrade pip
          pip install -r pc/requirements.txt
          pip install --no-binary pyinstaller pyinstaller==6.22.3

      # pip builds quietly, so nothing above shows the compile happened. Checked against the wheel's
      # stub instead, in case a cached wheel or a change in PyInstaller's packaging brings it back.
      - name: Check the bootloader is our own
        run: |
          pip download --quiet --no-deps --only-binary :all: pyinstaller==6.22.3 -d stock
          @'
          import glob, hashlib, os, sys, zipfile
          import PyInstaller
          stub = "PyInstaller/bootloader/Windows-64bit-intel/runw.exe"
          stock = hashlib.sha256(zipfile.ZipFile(glob.glob("stock/*.whl")[0]).read(stub)).hexdigest()
          ours = hashlib.sha256(open(os.path.join(os.path.dirname(PyInstaller.__file__), "..", stub), "rb").read()).hexdigest()
          print("stock", stock)
          print("ours ", ours)
          if stock == ours:
              print("::error::OverQueue.exe would start from PyInstaller's prebuilt bootloader")
              sys.exit(1)
          '@ | python -

      - name: Test
        run: python -m unittest discover -s pc/tests

      - name: Version
        id: version
        shell: bash
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            echo "version=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "version=0.0.0-dev.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          fi

      # The app compares this against the latest release to decide whether to offer an update.
      # Pull request builds stay on a 0.x version, which turns the check off.
      - name: Stamp the version
        shell: bash
        run: sed -i 's/^VERSION = .*/VERSION = "${{ steps.version.outputs.version }}"/' pc/version.py

      # The source is OverQueue Dev: its own pairing, the dev worker and the dev prerelease
      # (pc/channel.py). Checked afterwards, because a sed that matches nothing succeeds anyway and
      # would ship main's release as the dev app without a word.
      - name: Make it the real OverQueue
        if: inputs.real
        shell: bash
        run: |
          sed -i 's/^DEV = .*/DEV = False/' pc/version.py
          grep -qx 'DEV = False' pc/version.py || { echo "::error::DEV didn't land in pc/version.py"; exit 1; }

      - name: Build app
        run: pyinstaller --noconfirm pc/overqueue.spec

      - name: Build installer
        run: |
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue)) {
            $inno = "${env:ProgramFiles(x86)}\Inno Setup 6"
            if (-not (Test-Path "$inno\ISCC.exe")) { choco install innosetup -y --no-progress }
            $env:Path += ";$inno"
          }
          $defines = @("/DAppVersion=${{ steps.version.outputs.version }}")
          if ("${{ inputs.real }}" -eq "true") { $defines += "/DReal" }
          iscc @defines pc\installer.iss
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      - uses: actions/upload-artifact@v4
        with:
          name: OverQueue-Setup-${{ steps.version.outputs.version }}
          path: dist/OverQueue-Setup-*.exe
          if-no-files-found: error
