name: Android app

# Pull requests build the APK as a workflow artifact. Releases come from release.yml.
on:
  pull_request:
    paths:
      - "android/**"
      - ".github/workflows/android-app.yml"
  # The Release workflow calls this when the app changed since the last release.
  workflow_call:
    inputs:
      version:
        type: string
        required: true
      version-code:
        type: number
        required: false
        default: 1
      # Builds the real OverQueue, for main's release. Everything else -- pull requests, the dev
      # branch, a manual run -- is OverQueue Dev (android/app/build.gradle.kts).
      real:
        type: boolean
        required: false
        default: false
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      # One google-services.json holds every Android app in the Firebase project, so the same secret
      # serves both apps -- once OverQueue Dev has been added to the project and the file downloaded
      # again. Until then its builds get the placeholder.
      - name: Firebase config
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
          PACKAGE: com.tomerady.overwatchqueue${{ !inputs.real && '.dev' || '' }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            echo "$GOOGLE_SERVICES_JSON" | base64 --decode > app/google-services.json
          fi
          query='any(.client[]; .client_info.android_client_info.package_name == $package)'
          if ! jq -e --arg package "$PACKAGE" "$query" app/google-services.json > /dev/null 2>&1; then
            # Lets the build (and pull requests from forks) compile. That APK can't get pushes.
            echo "::warning::GOOGLE_SERVICES_JSON has no Firebase app for $PACKAGE; the APK is built with a placeholder Firebase config and won't get pushes."
            cat > app/google-services.json <<EOF
          {
            "project_info": {
              "project_number": "000000000000",
              "project_id": "overqueue-placeholder",
              "storage_bucket": "overqueue-placeholder.appspot.com"
            },
            "client": [{
              "client_info": {
                "mobilesdk_app_id": "1:000000000000:android:0000000000000000",
                "android_client_info": { "package_name": "$PACKAGE" }
              },
              "oauth_client": [],
              "api_key": [{ "current_key": "placeholder" }],
              "services": { "appinvite_service": { "other_platform_oauth_client": [] } }
            }],
            "configuration_version": "1"
          }
          EOF
          fi

      - name: Signing key
        env:
          ANDROID_DEBUG_KEYSTORE: ${{ secrets.ANDROID_DEBUG_KEYSTORE }}
        run: |
          # The same key every build, so a new APK installs over the old one.
          if [ -n "$ANDROID_DEBUG_KEYSTORE" ]; then
            mkdir -p ~/.android
            echo "$ANDROID_DEBUG_KEYSTORE" | base64 --decode > ~/.android/debug.keystore
          else
            echo "::warning::ANDROID_DEBUG_KEYSTORE secret isn't set; this APK is signed with a throwaway key and won't install over a previous one."
          fi

      - name: Version
        id: version
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            echo "version=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "version=0.0.0-dev.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          fi

      - name: Test and build
        run: >
          gradle --no-daemon :shared:testDebugUnitTest :app:assembleDebug
          -PversionName=${{ steps.version.outputs.version }}
          -PversionCode=${{ inputs.version-code || github.run_number }}
          -Pdev=${{ !inputs.real }}

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk "OverQueue-${{ steps.version.outputs.version }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: OverQueue-${{ steps.version.outputs.version }}-android
          path: android/OverQueue-*.apk
          if-no-files-found: error
