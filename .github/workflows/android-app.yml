name: Android app

# Pull requests and pushes to main build the APK as a workflow artifact.
# Pushing a tag like v1.2.3 also attaches it to that GitHub release.
on:
  pull_request:
    paths:
      - "android/**"
      - ".github/workflows/android-app.yml"
  push:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/android-app.yml"
    tags: ["v*"]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Firebase config
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            echo "$GOOGLE_SERVICES_JSON" | base64 --decode > app/google-services.json
          else
            # Lets the build (and pull requests from forks) compile. That APK can't get pushes.
            echo "::warning::GOOGLE_SERVICES_JSON secret isn't set; the APK is built with a placeholder Firebase config and won't get pushes."
            cat > app/google-services.json <<'EOF'
          {
            "project_info": {
              "project_number": "000000000000",
              "project_id": "owqueue-placeholder",
              "storage_bucket": "owqueue-placeholder.appspot.com"
            },
            "client": [{
              "client_info": {
                "mobilesdk_app_id": "1:000000000000:android:0000000000000000",
                "android_client_info": { "package_name": "com.tomerady.overwatchqueue" }
              },
              "oauth_client": [],
              "api_key": [{ "current_key": "placeholder" }],
              "services": { "appinvite_service": { "other_platform_oauth_client": [] } }
            }],
            "configuration_version": "1"
          }
          EOF
          fi

      - name: Version
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=0.0.0-dev.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          fi

      - name: Test and build
        run: >
          gradle --no-daemon :shared:testDebugUnitTest :app:assembleDebug
          -PversionName=${{ steps.version.outputs.version }}
          -PversionCode=${{ github.run_number }}

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk "OWQueue-${{ steps.version.outputs.version }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: OWQueue-${{ steps.version.outputs.version }}-android
          path: android/OWQueue-*.apk
          if-no-files-found: error

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The Windows workflow may have created the release already.
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --title "OW Queue $GITHUB_REF_NAME" --generate-notes \
            || true
          gh release upload "$GITHUB_REF_NAME" OWQueue-*.apk --clobber
