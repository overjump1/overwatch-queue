name: Release

# Every push to main that changes an app publishes a GitHub release with the APK, the Windows
# installer and the IPA. Only the apps that changed since the last release are rebuilt; the
# others are copied over from that release unchanged.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      rebuild-all:
        description: Rebuild every app, even the ones that didn't change
        type: boolean
        default: false

permissions:
  contents: write

# One release at a time, so each one compares against the release before it.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      android: ${{ steps.diff.outputs.android }}
      windows: ${{ steps.diff.outputs.windows }}
      ios: ${{ steps.diff.outputs.ios }}
      any: ${{ steps.diff.outputs.any }}
      previous: ${{ steps.diff.outputs.previous }}
      version: ${{ steps.diff.outputs.version }}
      version-code: ${{ steps.diff.outputs.version-code }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Find what changed since the last release
        id: diff
        env:
          GH_TOKEN: ${{ github.token }}
          REBUILD_ALL: ${{ inputs.rebuild-all || false }}
        run: |
          previous=$(gh release view --json tagName -q .tagName 2>/dev/null || true)
          assets=$( [ -n "$previous" ] && gh release view "$previous" --json assets -q '.assets[].name' || true)
          changed=$( [ -n "$previous" ] && git diff --name-only "$previous" HEAD || true)
          echo "Last release: ${previous:-none}"
          printf 'Changed since then:\n%s\n' "$changed"

          # Rebuilds an app when its files changed, when there's no earlier build to copy over,
          # or when asked to rebuild everything.
          check() {
            local name=$1 asset=$2 paths=$3
            if [ "$REBUILD_ALL" = true ] || [ -z "$previous" ] \
              || ! grep -qE "$asset" <<< "$assets" || grep -qE "$paths" <<< "$changed"; then
              echo "$name=true" >> "$GITHUB_OUTPUT"
              echo "Building $name"
              any=true
            else
              echo "$name=false" >> "$GITHUB_OUTPUT"
            fi
          }
          any=false
          check android '\.apk$' '^(android/|\.github/workflows/android-app\.yml)'
          check windows '\.exe$' '^(pc/|\.github/workflows/windows-app\.yml)'
          check ios '\.ipa$' '^(ios/|project\.yml|OverwatchQueue\.xcodeproj/|\.github/workflows/ios-app\.yml)'
          echo "any=$any" >> "$GITHUB_OUTPUT"
          echo "previous=$previous" >> "$GITHUB_OUTPUT"
          echo "version=2.0.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          # Above the numbers earlier CI builds used, so release APKs install over them.
          echo "version-code=$((GITHUB_RUN_NUMBER + 1000))" >> "$GITHUB_OUTPUT"

  android:
    needs: changes
    if: needs.changes.outputs.android == 'true'
    uses: ./.github/workflows/android-app.yml
    secrets: inherit
    with:
      version: ${{ needs.changes.outputs.version }}
      version-code: ${{ fromJSON(needs.changes.outputs.version-code) }}

  windows:
    needs: changes
    if: needs.changes.outputs.windows == 'true'
    uses: ./.github/workflows/windows-app.yml
    secrets: inherit
    with:
      version: ${{ needs.changes.outputs.version }}

  ios:
    needs: changes
    if: needs.changes.outputs.ios == 'true'
    uses: ./.github/workflows/ios-app.yml
    secrets: inherit
    with:
      version: ${{ needs.changes.outputs.version }}
      build-number: ${{ fromJSON(github.run_number) }}

  release:
    needs: [changes, android, windows, ios]
    # Runs when the builds that were needed all passed; skipped builds are fine.
    if: >
      always() && needs.changes.outputs.any == 'true'
      && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true

      - name: Copy unchanged apps from the last release
        env:
          GH_TOKEN: ${{ github.token }}
          PREVIOUS: ${{ needs.changes.outputs.previous }}
        run: |
          copy() {
            if [ "$1" != true ] && [ -n "$PREVIOUS" ]; then
              gh release download "$PREVIOUS" --repo "$GITHUB_REPOSITORY" --pattern "$2" --dir release
            fi
          }
          copy "${{ needs.changes.outputs.android }}" '*.apk'
          copy "${{ needs.changes.outputs.windows }}" '*.exe'
          copy "${{ needs.changes.outputs.ios }}" '*.ipa'
          ls -l release

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.changes.outputs.version }}
        run: |
          built=()
          [ "${{ needs.changes.outputs.android }}" = true ] && built+=("Android")
          [ "${{ needs.changes.outputs.windows }}" = true ] && built+=("Windows")
          [ "${{ needs.changes.outputs.ios }}" = true ] && built+=("iPhone")
          notes="New builds: $(IFS=,; echo "${built[*]}" | sed 's/,/, /g'). The other apps are unchanged from the previous release."
          gh release create "v$VERSION" release/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "OW Queue $VERSION" \
            --notes "$notes" \
            --generate-notes

      # Only the newest build stays downloadable, so nobody installs one we have moved past or
      # reports a bug from it. This runs after the release above, which already copied out of the
      # last one whatever it needed. The tags stay, so `changes` can still diff against them.
      - name: Take down the older releases
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.changes.outputs.version }}
        run: |
          tags=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 100 --json tagName -q '.[].tagName')
          for tag in $tags; do
            if [ "$tag" != "v$VERSION" ]; then
              echo "Deleting $tag"
              gh release delete "$tag" --repo "$GITHUB_REPOSITORY" --yes
            fi
          done
