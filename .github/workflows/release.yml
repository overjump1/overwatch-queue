name: Release

# Every push to main that changes an app publishes a GitHub release with the APK, the Windows
# installer and the IPA. Only the apps that changed since the last release are rebuilt; the
# others are copied over from that release unchanged.
#
# Pushes to dev do the same into a single prerelease, dev-latest, replaced on every build. Those
# builds are OverQueue Dev: separate apps that install beside the real ones, with their own pairing,
# talking to the dev worker and updating only from dev-latest. GitHub never counts a prerelease as
# the latest release, which is exactly what the real apps ask for, so they never see a dev one.
#
# Every app builds as OverQueue Dev unless it's told otherwise, and only main's release tells it.
on:
  push:
    branches: [main, dev]
  workflow_dispatch:
    inputs:
      rebuild-all:
        description: Rebuild every app, even the ones that didn't change
        type: boolean
        default: false

permissions:
  contents: write

# One release at a time, so each one compares against the release before it.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  changes:
    # A manual run from any other branch would publish that branch as the real release and take
    # the actual one down.
    if: github.ref_name == 'main' || github.ref_name == 'dev'
    runs-on: ubuntu-latest
    outputs:
      android: ${{ steps.diff.outputs.android }}
      windows: ${{ steps.diff.outputs.windows }}
      ios: ${{ steps.diff.outputs.ios }}
      any: ${{ steps.diff.outputs.any }}
      previous: ${{ steps.diff.outputs.previous }}
      version: ${{ steps.diff.outputs.version }}
      version-code: ${{ steps.diff.outputs.version-code }}
      channel: ${{ steps.diff.outputs.channel }}
      real: ${{ steps.diff.outputs.real }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Find what changed since the last release
        id: diff
        env:
          GH_TOKEN: ${{ github.token }}
          REBUILD_ALL: ${{ inputs.rebuild-all || false }}
          CHANNEL: ${{ github.ref_name == 'dev' && 'dev' || 'main' }}
        run: |
          # dev's last build is its one prerelease. main's is the newest real release, which is what
          # `gh release view` with no tag gives -- never a prerelease, so never dev-latest.
          if [ "$CHANNEL" = dev ]; then
            previous=$(gh release view dev-latest --json tagName -q .tagName 2>/dev/null || true)
          else
            previous=$(gh release view --json tagName -q .tagName 2>/dev/null || true)
          fi
          assets=$( [ -n "$previous" ] && gh release view "$previous" --json assets -q '.assets[].name' || true)
          changed=$( [ -n "$previous" ] && git diff --name-only "$previous" HEAD || true)
          echo "Last release: ${previous:-none}"
          printf 'Changed since then:\n%s\n' "$changed"

          # Rebuilds an app when its files changed, when there's no earlier build to copy over,
          # or when asked to rebuild everything.
          check() {
            local name=$1 asset=$2 paths=$3
            if [ "$REBUILD_ALL" = true ] || [ -z "$previous" ] \
              || ! grep -qE "$asset" <<< "$assets" || grep -qE "$paths" <<< "$changed"; then
              echo "$name=true" >> "$GITHUB_OUTPUT"
              echo "Building $name"
              any=true
            else
              echo "$name=false" >> "$GITHUB_OUTPUT"
            fi
          }
          any=false
          check android '\.apk$' '^(android/|\.github/workflows/android-app\.yml)'
          check windows '\.exe$' '^(pc/|\.github/workflows/windows-app\.yml)'
          check ios '\.ipa$' '^(ios/|project\.yml|OverQueue\.xcodeproj/|\.github/workflows/ios-app\.yml)'
          echo "any=$any" >> "$GITHUB_OUTPUT"
          echo "previous=$previous" >> "$GITHUB_OUTPUT"
          echo "channel=$CHANNEL" >> "$GITHUB_OUTPUT"
          echo "real=$( [ "$CHANNEL" = main ] && echo true || echo false )" >> "$GITHUB_OUTPUT"
          if [ "$CHANNEL" = dev ]; then
            echo "version=2.0.${GITHUB_RUN_NUMBER}-dev" >> "$GITHUB_OUTPUT"
          else
            echo "version=2.0.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          fi
          # Above the numbers earlier CI builds used, so release APKs install over them. The dev app
          # is a separate app, so its numbers never have to beat the real one's.
          echo "version-code=$((GITHUB_RUN_NUMBER + 1000))" >> "$GITHUB_OUTPUT"

  android:
    needs: changes
    if: needs.changes.outputs.android == 'true'
    uses: ./.github/workflows/android-app.yml
    secrets: inherit
    with:
      version: ${{ needs.changes.outputs.version }}
      version-code: ${{ fromJSON(needs.changes.outputs.version-code) }}
      real: ${{ fromJSON(needs.changes.outputs.real) }}

  windows:
    needs: changes
    if: needs.changes.outputs.windows == 'true'
    uses: ./.github/workflows/windows-app.yml
    secrets: inherit
    with:
      version: ${{ needs.changes.outputs.version }}
      real: ${{ fromJSON(needs.changes.outputs.real) }}

  ios:
    needs: changes
    if: needs.changes.outputs.ios == 'true'
    uses: ./.github/workflows/ios-app.yml
    secrets: inherit
    with:
      version: ${{ needs.changes.outputs.version }}
      build-number: ${{ fromJSON(github.run_number) }}
      real: ${{ fromJSON(needs.changes.outputs.real) }}

  release:
    needs: [changes, android, windows, ios]
    # Runs when the builds that were needed all passed; skipped builds are fine.
    if: >
      always() && needs.changes.outputs.any == 'true'
      && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true

      - name: Copy unchanged apps from the last release
        env:
          GH_TOKEN: ${{ github.token }}
          PREVIOUS: ${{ needs.changes.outputs.previous }}
        run: |
          copy() {
            if [ "$1" != true ] && [ -n "$PREVIOUS" ]; then
              gh release download "$PREVIOUS" --repo "$GITHUB_REPOSITORY" --pattern "$2" --dir release
            fi
          }
          copy "${{ needs.changes.outputs.android }}" '*.apk'
          copy "${{ needs.changes.outputs.windows }}" '*.exe'
          copy "${{ needs.changes.outputs.ios }}" '*.ipa'
          ls -l release

      - name: Publish release
        if: needs.changes.outputs.channel == 'main'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.changes.outputs.version }}
        run: |
          built=()
          [ "${{ needs.changes.outputs.android }}" = true ] && built+=("Android")
          [ "${{ needs.changes.outputs.windows }}" = true ] && built+=("Windows")
          [ "${{ needs.changes.outputs.ios }}" = true ] && built+=("iPhone")
          notes="New builds: $(IFS=,; echo "${built[*]}" | sed 's/,/, /g'). The other apps are unchanged from the previous release."
          gh release create "v$VERSION" release/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "OverQueue $VERSION" \
            --notes "$notes" \
            --generate-notes

      # One prerelease, taken down and put back up with each build, so its address never moves: the
      # dev apps ask for /releases/tags/dev-latest the way the real ones ask for /releases/latest.
      # --latest=false on top of --prerelease, so it can never become the release those update to.
      - name: Publish the dev prerelease
        if: needs.changes.outputs.channel == 'dev'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.changes.outputs.version }}
        run: |
          built=()
          [ "${{ needs.changes.outputs.android }}" = true ] && built+=("Android")
          [ "${{ needs.changes.outputs.windows }}" = true ] && built+=("Windows")
          [ "${{ needs.changes.outputs.ios }}" = true ] && built+=("iPhone")
          notes="OverQueue Dev, built from ${GITHUB_SHA::7}: installs beside the real apps and talks to the dev worker. New builds: $(IFS=,; echo "${built[*]}" | sed 's/,/, /g'). The other apps are unchanged from the previous dev build."
          gh release delete dev-latest --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes 2>/dev/null || true
          # And the tag itself, in case it outlived its release: a new release made on a leftover tag
          # would sit on the old commit, and the next build would diff against the wrong one.
          gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/tags/dev-latest" 2>/dev/null || true
          gh release create dev-latest release/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "OverQueue $VERSION (dev)" \
            --notes "$notes" \
            --prerelease \
            --latest=false

      # Only the newest build stays downloadable. The step above has already copied out of the last
      # release whatever it needed, and the tags stay, so `changes` can still diff against them.
      - name: Take down the older releases
        if: needs.changes.outputs.channel == 'main'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.changes.outputs.version }}
        run: |
          tags=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 100 --json tagName -q '.[].tagName')
          for tag in $tags; do
            # dev-latest belongs to the dev branch, and it replaces itself.
            if [ "$tag" != "v$VERSION" ] && [ "$tag" != "dev-latest" ]; then
              echo "Deleting $tag"
              gh release delete "$tag" --repo "$GITHUB_REPOSITORY" --yes
            fi
          done
