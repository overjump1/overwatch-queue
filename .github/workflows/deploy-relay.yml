name: Worker

on:
  pull_request:
    paths:
      - "worker/**"
      - ".github/workflows/deploy-relay.yml"
  # main deploys the real worker; dev deploys the dev one (wrangler.toml's [env.dev]).
  push:
    branches: [main, dev]
    paths:
      - "worker/**"
      - ".github/workflows/deploy-relay.yml"
  workflow_dispatch: {}

permissions:
  contents: read

defaults:
  run:
    working-directory: worker

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: worker/package-lock.json

      - run: npm ci

      - run: npm test

      - run: npx tsc --noEmit

  deploy:
    needs: test
    # Only main and dev have a worker of their own. A manual run from any other branch would
    # otherwise put that branch on the real worker.
    if: github.event_name != 'pull_request' && (github.ref_name == 'main' || github.ref_name == 'dev')
    runs-on: ubuntu-latest
    # Two deploys of the same worker never overlap, so the secret lands on the version it follows.
    concurrency:
      group: deploy-relay-${{ github.ref_name }}
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      # Empty means the top of wrangler.toml, the real worker. Passed even then: with more than one
      # environment defined, wrangler warns about a deploy that doesn't say which it means.
      WORKER_ENV: ${{ github.ref_name == 'dev' && 'dev' || '' }}
      WORKER_URL: ${{ github.ref_name == 'dev' && 'https://overwatch-queue-push-relay-dev.tomerady.workers.dev' || 'https://overwatch-queue-push-relay.tomerady.workers.dev' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: worker/package-lock.json

      - run: npm ci

      # Refuses to deploy a relay that can't reach Firebase. Without the service account
      # every push fails at the relay, and nothing on the PC or the phone says why.
      - name: Check the Firebase secret
        env:
          FCM_SERVICE_ACCOUNT: ${{ secrets.FCM_SERVICE_ACCOUNT }}
        run: |
          # Checked here, not with a step-level `if:` — GitHub Actions doesn't allow the
          # `secrets` context in a step's `if:` condition at all.
          if [ -z "$FCM_SERVICE_ACCOUNT" ]; then
            echo "::error::The FCM_SERVICE_ACCOUNT repository secret isn't set. See README.md."
            exit 1
          fi
          printf '%s' "$FCM_SERVICE_ACCOUNT" | node -e '
            const account = JSON.parse(require("fs").readFileSync(0, "utf8"));
            for (const key of ["project_id", "client_email", "private_key"]) {
              if (!account[key]) { console.error(`::error::FCM_SERVICE_ACCOUNT has no ${key}`); process.exit(1); }
            }'

      - name: Deploy
        run: npx wrangler deploy --env "$WORKER_ENV"

      # After the deploy, so the secret lands on the Worker version that reads it.
      - name: Sync the Firebase secret
        env:
          FCM_SERVICE_ACCOUNT: ${{ secrets.FCM_SERVICE_ACCOUNT }}
        run: printf '%s' "$FCM_SERVICE_ACCOUNT" | npx wrangler secret put FCM_SERVICE_ACCOUNT --env "$WORKER_ENV"

      - name: Smoke test
        working-directory: .
        run: |
          for attempt in 1 2 3 4 5 6; do
            body=$(curl -s -H "User-Agent: OverQueue/2.0" "$WORKER_URL/v1/pair/not-a-pair/state")
            echo "$body"
            echo "$body" | grep -q "bad_pair_id" && exit 0
            sleep 10
          done
          exit 1
